description = Claude Code, as a standalone native binary (no Node needed)
default_version = 2.1.330
command = silkgate-claude
# The dummy credential the guest holds, picked by the header SILKGATE_EGRESS_SECRET_ANTHROPIC
# names: the proxy swaps only a header the guest sends. An x-api-key secret (a Console API
# key) plants a dummy API key. An Authorization secret (`Bearer` and a `claude setup-token`
# token, for a Team or Enterprise subscription) plants a dummy OAuth token, which --bare does
# not read. An absent secret plants the API key.
guest_credential = anthropic
guest_credential.x-api-key = ANTHROPIC_API_KEY=sk-ant-DUMMY-replaced-by-egress-proxy
guest_credential.authorization = CLAUDE_CODE_OAUTH_TOKEN=sk-ant-oat01-DUMMY-replaced-by-egress-proxy
packages = curl libgcc-s1 libstdc++6 ripgrep
# Where Claude Code looks for instructions — read on a plain `claude -p`, though not under
# --bare, which skips discovery entirely; pass --append-system-prompt-file there.
context_path = /root/.claude/CLAUDE.md
# Where Claude Code reads user-rank settings — the launch-time projection of the host's
# model configuration (model, effortLevel) lands here.
settings_path = /root/.claude/settings.json
