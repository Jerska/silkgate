description = Claude Code, as a standalone native binary (no Node needed)
default_version = 2.1.89
command = silkgate-claude
packages = curl libgcc-s1 libstdc++6 ripgrep
# Where Claude Code looks for instructions — read on a plain `claude -p`, though not under
# --bare, which skips discovery entirely; pass --append-system-prompt-file there.
context_path = /root/.claude/CLAUDE.md
