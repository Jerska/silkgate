# Everything here runs on a bare runner — no VM, no docker, no KVM — so a red is
# reproducible on any machine with python3. The containment check itself needs a
# microVM and lives in containment.yml.
#
# Actions are pinned to commit SHAs, tag in the trailing comment, for the same reason
# msb, mitmproxy, node and python are pinned everywhere else in this repo: a mutable
# tag is an unpinned dependency with write access to the workflow.
name: tests

on: [push, pull_request]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # cli/ and mitmaddon/ are stdlib-only by contract (AGENTS.md) and run on hosts, never
  # in guests — so the interpreters that matter are the ones hosts actually have. 3.12 is
  # noble's python3, the one interpreter this repo ships (the test/linux container); 3.13
  # is what current hosts run. Stdlib-only code is exactly where interpreter drift breaks
  # things, and nothing is installed here, so covering both costs seconds.
  stdlib:
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      # The whole host suite through the sharded runner, the same command a human runs
      # locally. A list, gated against discovery: the runner exits 2 before any test
      # starts unless SHARDS covers discovery exactly, so a new test/test_*.py that
      # nobody named in SHARDS is a loud red here, never a file CI silently skips.
      # test/test_scripts.py carries the checks that are not unittest files — the
      # engine's in-module self-tests, the asserting test/repro/ scripts (a per-file
      # decision, never a glob), and `bash -n` on the guest script — and a syntax error
      # in cli/silkgate fails the four modules that load it. mitmproxy is deliberately
      # absent here, so the whole test_addon module records as one skip: the summary
      # table's skip column must show it on the shard that holds test_addon, and the OK
      # line must count it. An import error in that module is not a skip — discovery
      # reports it and the runner exits 2 — and the addon jobs below run those tests for
      # real. Every shard process runs even after one fails, and each shard runs all of
      # its tests, so a red run still names all of the broken files at once.
      - name: host suite, addon tests skipping for want of mitmproxy
        run: python3 tests.py

  # The addon reaches into mitmproxy internals — flow.request.host_header, the
  # http_connect hook, .stream semantics — so it is tested against the exact version the
  # rest of the repo pins, on 3.12: the interpreter the test/linux container runs it on.
  addon:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: install the pinned mitmproxy
        run: python3 -m pip install mitmproxy==12.2.3
      - name: addon enforcement tests
        run: python3 test/test_addon.py

  # Early warning, not a gate: the same suite against whatever `pip install mitmproxy` on
  # a current interpreter resolves to today, so the pin's eventual bump is scheduled by a
  # red canary here instead of forced by a security release. Both mitmproxy and python
  # float on purpose — pinning python would let a future mitmproxy that needs a newer
  # interpreter quietly resolve to an old release, and the canary would stop canarying.
  # The pinned jobs above isolate each variable; the resolved version lands in the step
  # summary so a failure names the release that broke us. continue-on-error keeps a red
  # from blocking anything.
  addon-mitmproxy-latest:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'
      - name: install current mitmproxy
        run: python3 -m pip install mitmproxy
      - name: addon enforcement tests against current mitmproxy
        run: |
          python3 -c "from importlib.metadata import version; print('mitmproxy', version('mitmproxy'))" \
            | tee -a "$GITHUB_STEP_SUMMARY"
          python3 test/test_addon.py
