# Everything here runs on a bare runner — no VM, no docker, no KVM — so a red is
# reproducible on any machine with python3. The containment check itself needs a
# microVM and lives in containment.yml.
#
# Actions are pinned to commit SHAs, tag in the trailing comment, for the same reason
# msb, mitmproxy, node and python are pinned everywhere else in this repo: a mutable
# tag is an unpinned dependency with write access to the workflow.
name: tests

on: [push, pull_request]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # cli/ and mitmaddon/ are stdlib-only and run on hosts, so test the hosts' interpreters:
  # 3.12 (noble's, in the test/linux container) and 3.13 (current hosts).
  stdlib:
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}

      # The whole host suite, as a human runs it. The runner exits 2 before any test unless
      # SHARDS covers discovery exactly, so a new test file can't be silently skipped.
      # test/test_scripts.py runs the non-unittest checks: the engine's self-tests, the
      # asserting repro scripts, and `bash -n` on the guest script. mitmproxy is absent
      # here on purpose, so test_addon records as one skip (the addon jobs below run it).
      # Every shard runs to the end, so a red run names every broken file at once.
      - name: host suite, addon tests skipping for want of mitmproxy
        run: python3 tests.py

  # The addon reaches into mitmproxy internals — flow.request.host_header, the
  # http_connect hook, .stream semantics — so it is tested against the exact version the
  # rest of the repo pins, on 3.12: the interpreter the test/linux container runs it on.
  addon:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: install the pinned mitmproxy
        run: python3 -m pip install mitmproxy==12.3.1
      - name: addon enforcement tests
        run: python3 test/test_addon.py

  # A canary, not a gate: the addon suite against the latest mitmproxy and python, so a
  # pin bump is planned, not forced by a security release. Python floats too, or a
  # mitmproxy needing a newer one would resolve to an old release. The resolved version
  # goes in the step summary. continue-on-error keeps a red from blocking anything.
  addon-mitmproxy-latest:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.x'
      - name: install current mitmproxy
        run: python3 -m pip install mitmproxy
      - name: addon enforcement tests against current mitmproxy
        run: |
          python3 -c "from importlib.metadata import version; print('mitmproxy', version('mitmproxy'))" \
            | tee -a "$GITHUB_STEP_SUMMARY"
          python3 test/test_addon.py
